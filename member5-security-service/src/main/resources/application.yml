server:
  port: 8085

spring:
  application:
    name: security-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/securitydb}

app:
  initial-admin-key: ${INITIAL_ADMIN_KEY:soc-admin-change-me}

  admin:
    username: ${ADMIN_USERNAME:admin@socshop.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

  session:
    duration-hours: ${SESSION_DURATION_HOURS:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info