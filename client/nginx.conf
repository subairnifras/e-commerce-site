server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;

        proxy_set_header X-API-KEY ${INTERNAL_API_KEY};
        proxy_set_header Host $host;
    }
}